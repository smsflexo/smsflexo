<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SMS Proofs</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f6fb;
      color: #1f2937;
    }
    header {
      background: #123b70;
      color: white;
      text-align: center;
      padding: 28px 15px;
    }
    header h1 { margin: 0 0 10px; }
    main {
      max-width: 700px;
      margin: 35px auto;
      padding: 25px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 15px #00000010;
    }
    h2 { color: #123b70; }
    .notice {
      background: #eaf2ff;
      padding: 15px;
      border-radius: 8px;
      line-height: 1.6;
    }
    footer {
      text-align: center;
      padding: 20px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <header>
    <h1>SMS Proofs</h1>
    <p>Your SMS Proofs Website</p>
  </header>
  <main>
    <h2>Welcome!</h2>
    <p>Welcome to the SMS Proofs website.</p>
    <div class="notice">
      Your website is ready for its next update.
      Add your actual SMS proof content here.
    </div>
  </main>
  <footer>&copy; 2026 SMS Proofs</footer>
</body>
</html>
